<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c882" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00c882" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1a1a2a" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1a1a2a" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1a1a2a" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1a1a2a" stroke-width="1"/>

  <!-- Logo mark -->
  <g transform="translate(480, 160)">
    <circle cx="120" cy="120" r="110" stroke="#1a1a2a" stroke-width="2" fill="none"/>
    <circle cx="120" cy="18" r="14" fill="#00c882"/>
    <circle cx="213" cy="68" r="14" fill="#00c882" opacity=".7"/>
    <circle cx="213" cy="172" r="14" fill="#00c882" opacity=".4"/>
    <circle cx="120" cy="222" r="14" fill="#00c882" opacity=".3"/>
    <circle cx="27" cy="172" r="14" fill="#00c882" opacity=".4"/>
    <circle cx="27" cy="68" r="14" fill="#00c882" opacity=".7"/>
    <line x1="120" y1="18" x2="213" y2="68" stroke="#00c882" stroke-width="1.5" opacity=".3"/>
    <line x1="213" y1="68" x2="213" y2="172" stroke="#00c882" stroke-width="1.5" opacity=".2"/>
    <line x1="120" y1="18" x2="27" y2="68" stroke="#00c882" stroke-width="1.5" opacity=".3"/>
    <line x1="27" y1="68" x2="27" y2="172" stroke="#00c882" stroke-width="1.5" opacity=".2"/>
    <line x1="120" y1="18" x2="120" y2="222" stroke="#00c882" stroke-width="1" opacity=".15" stroke-dasharray="6 4"/>
    <circle cx="120" cy="120" r="22" fill="#00c882"/>
    <circle cx="120" cy="120" r="38" stroke="#00c882" stroke-width="1.5" opacity=".2" fill="none"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="430" font-family="'Arial', sans-serif" font-size="72" font-weight="700" fill="#f0f0f0" text-anchor="middle" letter-spacing="-2">node<tspan fill="#00c882">feeds</tspan></text>

  <!-- Tagline -->
  <text x="600" y="490" font-family="'Courier New', monospace" font-size="18" fill="#555" text-anchor="middle" letter-spacing="4">// AI &amp; TECH INTELLIGENCE</text>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#050508"/>
  <text x="600" y="612" font-family="'Courier New', monospace" font-size="14" fill="#333" text-anchor="middle" letter-spacing="2">UPDATED EVERY 6 HOURS · NODEFEEDS.COM</text>

  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="#00c882" opacity=".6"/>
</svg>
